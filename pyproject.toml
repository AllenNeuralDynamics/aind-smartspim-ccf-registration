[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "aind_ccf_reg"
description = "Registers SmartSPIM lightsheet datasets to the Allen Common Coordinate Framework (CCF) atlas using ANTs."
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3"
]
dynamic = ["version", "readme"]

dependencies = [
  'numpy==1.26.4',
  'antspyx==0.6.3',
  'argschema==3.0.4',
  'scikit-image==0.24.0',
  'tifffile==2022.10.10',
  'bokeh==3.8.2',
  'zarr==2.13.3 ',
  'numcodecs==0.14.1',
  'aind-data-schema==2.8.0',
  'aind-data-schema-models>=5.7.1,<6',
  'psutil',
  'dask[distributed]==2026.6.0',
  'cloud-volume[all_codecs]==11.0.2',
  'matplotlib==3.10.9',
  'ome-zarr==0.8.2',
  'natsort==8.4.0',
  'crackle-codec==0.26.0',
  'tensorstore==0.1.72',
  'compresso',
  's3fs',
  'boto3',
  'log-schema==0.2.10.dev1'
]

[project.optional-dependencies]
dev = [
  'ruff',
  'coverage',
  'interrogate',
  'furo',
  'Sphinx'
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.setuptools.dynamic]
version = {attr = "aind_ccf_reg.__version__"}
readme = {file = ["README.md"]}

[tool.coverage.run]
omit = ["*__init__*"]
source = ["code/aind_ccf_reg", "tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "from",
    "import",
    "pragma: no cover"
]
fail_under = 40

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb", ".venv", "*.egg-info", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# ruff format enforces line-length structurally; E501 only fires on tokens it
# cannot split (URLs, long string literals), so the two rules conflict.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
# blosc.use_threads must be set before these imports execute.
"code/aind_ccf_reg/register.py" = ["E402"]

[tool.interrogate]
exclude = ["setup.py", "docs", "build"]
fail-under = 100
